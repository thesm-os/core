version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  go: "1.26"
  relative-path-mode: gomod

output:
  show-stats: true
  path-mode: "abs"
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Bugs & safety
    - copyloopvar
    - errcheck
    - errorlint
    - exhaustive
    - gosec
    - govet
    - nilerr
    - predeclared
    - staticcheck
    - unused
    - wastedassign
    # Modernization / BC
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - noctx
    - perfsprint
    - prealloc
    # Architecture & style
    - decorder
    - depguard
    - dupword
    - forbidigo
    - interfacebloat
    - misspell
    - revive
    - wrapcheck
    - musttag
    - sloglint
    - usestdlibvars
    - nilnil
    - goconst
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    - whitespace
    # Test hygiene
    - testifylint
    - thelper
    - tparallel
    - paralleltest
    - usetesting

  settings:
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false

    # Stdlib-only enforcement. core has zero non-stdlib dependencies
    # by design (see ADR-0001). Any new import outside the stdlib or
    # this module fails lint.
    depguard:
      rules:
        main:
          list-mode: strict
          files:
            - "$all"
            - "!$test"
            - "!**/coretest/**"
          allow:
            - $gostd
            - go.thesmos.sh/core
        test:
          # Files in coretest/ are non-_test.go but they are test
          # infrastructure (hand-rolled spec / model / stub
          # companions). Treat them as tests for import-allow
          # purposes.
          list-mode: strict
          files:
            - "$test"
            - "**/coretest/**"
          allow:
            - $gostd
            - go.thesmos.sh/core
            - go.thesmos.sh/testkit
            - go.thesmos.sh/testkit/model
            - pgregory.net/rapid

    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: "panic() is forbidden in library code; return errors explicitly."
        - pattern: ^fmt\.(Print|Printf|Println|Fprint|Fprintf|Fprintln)$
          msg: "Use structured logging, not fmt.Print*."

    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch

    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true

    gocritic:
      enabled-tags:
        - performance
        - diagnostic
      disabled-checks:
        - ifElseChain
        - commentedOutCode
      settings:
        hugeParam:
          sizeThreshold: 256
        rangeValCopy:
          sizeThreshold: 256

    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
      ignore-package-globs:
        - go.thesmos.sh/core/*

    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: exported
          severity: warning
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unexported-return
        - name: redundant-import-alias
        - name: range
        - name: empty-block
        - name: unnecessary-stmt
        - name: modifies-value-receiver
        - name: time-naming
        - name: unused-receiver

    govet:
      enable-all: true

    interfacebloat:
      max: 10

    asasalint:
      use-builtin-exclusions: true

    copyloopvar:
      check-alias: true

    whitespace:
      multi-if: true
      multi-func: false

  exclusions:
    generated: lax
    paths:
      - docs
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # rand/pcg is a deliberately non-cryptographic PRNG. The G404
      # warning ("use crypto/rand") is wrong for this package by
      # design (see docs/adr/0006 and rand/pcg/doc.go), and the
      # int64 → uint64 seed conversion is a deliberate bit-pattern
      # reinterpretation supported by the PCG construction.
      - path: "rand/pcg/"
        linters: [gosec]
        text: "G404:|G115:"

      # rand/helpers Shuffle converts uint64n's bounded result to
      # int. The result is mathematically guaranteed to fit; G115
      # cannot prove it. Same logic applies in helpers_test.go's
      # reference implementation.
      - path: "rand/helpers"
        linters: [gosec]
        text: "G115:"

      # rand/seeded uses int64 → uint64 as a bit-pattern
      # reinterpretation when keying HMAC; safe by construction.
      # Same logic in seeded_test.go.
      - path: "rand/seeded"
        linters: [gosec]
        text: "G115:"

      # id/ksuid base62 long division uses uint64 → uint32 as
      # multi-precision arithmetic. Format: dividend x = rem<<32 |
      # num[j] where rem ∈ [0,61], so x/62 < 2^32 and the
      # truncation is provably exact. Parse: x = num[j]*62 + carry
      # is split into the new num[j] (low 32) and the next carry
      # (x>>32), so uint32(x) is the intentional bit-pattern
      # split for multi-precision multiply-and-add.
      - path: 'id/ksuid/parse\.go'
        linters: [gosec]
        text: "G115:"

      # rand/crypto.Rand.Uint64 panics on entropy-source failure
      # by deliberate design — see the Failure semantics section
      # in rand/crypto/crypto.go. Returning a sentinel from a
      # CSPRNG is the worst possible failure mode for a security
      # primitive.
      - path: 'rand/crypto/crypto\.go'
        linters: [forbidigo]
        text: "panic"

      # TestZeroAlloc tests use testing.AllocsPerRun which relies
      # on a process-global malloc counter; running them in
      # parallel with other tests produces flaky alloc counts.
      - source: "func TestZeroAlloc"
        linters: [paralleltest]
      - path: '_test\.go'
        text: "TestZeroAlloc"
        linters: [paralleltest]

      # Ad-hoc {name, fn} subtest table struct in TestZeroAlloc.
      # Reordering fields does not change the ptr-byte count — the
      # linter's suggested arrangement matches the current one.
      - path: '_test\.go'
        linters: [govet]
        text: "fieldalignment:.*"

      # Goconst
      - path: '_test\.go'
        linters: [goconst, gosec]

      # testkit suite XxxCustom callbacks accept a *testing.T as
      # their first argument, but they are NOT test helpers —
      # each closure runs as the body of a t.Run subtest set up
      # by AssertXxxContract. t.Helper() would mis-attribute
      # failures to the registration line instead of the failing
      # line inside the closure. Suppress thelper for hand-rolled
      # spec / stub / fixture files in coretest/<pkg>test/.
      - path: 'coretest/[a-z]+test/[a-z_]+\.(go)'
        linters: [thelper]

      # cryptotest helpers panic on unsupported digest sizes (a
      # programmer error — caller passed a Sum function with the
      # wrong return shape). The package-level "Failure semantics"
      # contract permits panic for caller-misuse paths.
      - path: 'coretest/cryptotest/.*\.go'
        linters: [forbidigo]
        text: "panic"

      # cryptotest stream companion delegates Write straight to a
      # stdlib hash.Hash; nothing meaningful to wrap.
      - path: 'coretest/cryptotest/stream_stub\.go'
        linters: [wrapcheck]

      # gocritic's unlambda flags `func() hash.Hash { return
      # sha256.New() }` as replaceable with `sha256.New`. The
      # explicit-lambda form is clearer when assigning to a
      # struct field with a typed function shape.
      - path: 'crypto/(hmac/)?sha[0-9_]+/sha[0-9_]+_test\.go'
        linters: [gocritic]
        text: "unlambda"

      # govet fieldalignment on test-only Spec structs: pointer-
      # byte savings don't matter for a one-per-test instance.
      - path: 'coretest/cryptotest/[a-z]+_model\.go'
        linters: [govet]
        text: "fieldalignment"

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(go.thesmos.sh/core)
      custom-order: true
    golines:
      max-len: 120
    gofumpt:
      extra-rules: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

severity:
  default: error
