# core pre-commit configuration.
#
# Install:  pre-commit install --hook-type pre-commit \
#                              --hook-type pre-push \
#                              --hook-type commit-msg

default_stages: [pre-commit]

repos:
  # ─── File hygiene ──────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: check-merge-conflict
      - id: detect-private-key
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: check-json
      - id: check-toml
      - id: check-symlinks

  # ─── The gate, minus the one slow stage ───────────────────────
  #
  # mod + lint + test + coverage is 2.4s on a warm Go cache, so it
  # belongs at commit time where the feedback is worth most. Mutation
  # is the entire remaining cost of `make check` — tens of minutes —
  # and running it here would train everyone to pass --no-verify,
  # which costs more than it catches. CI runs it per push instead.
  #
  # Repeated at pre-push deliberately: with caches warm it is
  # near-instant, and it catches the case where a commit landed
  # through --no-verify or an amend.
  - repo: local
    hooks:
      - id: check-fast
        name: ergon check (skip mutation)
        entry: ergon check --skip mutation
        language: system
        pass_filenames: false
        stages: [pre-commit, pre-push]

  # ─── Commit message ───────────────────────────────────────────
  - repo: local
    hooks:
      - id: ergon-commit-msg
        name: ergon check commit-msg
        entry: ergon check commit-msg
        language: system
        stages: [commit-msg]
