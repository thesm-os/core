name: Setup ergon
description: >-
  Install a pinned ergon release into the Go bin directory, which
  actions/setup-go adds to PATH, so run this after actions/setup-go.
  Every job that invokes a make target needs this: the Makefile
  delegates to ergon, and `make bootstrap` is itself `ergon bootstrap`,
  so ergon cannot bootstrap itself. On Windows it also installs GNU
  make, which the Windows image does not include.

inputs:
  version:
    description: ergon release version, without the leading "v".
    required: false
    # Pinned rather than latest so a CI failure is attributable to the
    # commit under test and not to a tool that moved underneath it.
    # Bump here and the whole workflow set follows.
    default: "1.8.1"

runs:
  using: composite
  steps:
    - name: Install ergon ${{ inputs.version }}
      if: runner.os != 'Windows'
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        case "$RUNNER_OS" in
          Linux) os=linux ;;
          macOS) os=darwin ;;
          *) echo "::error::ergon ships no build for $RUNNER_OS"; exit 1 ;;
        esac
        case "$RUNNER_ARCH" in
          X64) arch=amd64 ;;
          ARM64) arch=arm64 ;;
          *) echo "::error::ergon ships no build for $RUNNER_ARCH"; exit 1 ;;
        esac
        bin="$(go env GOPATH)/bin"
        mkdir -p "$bin"
        url="https://github.com/thesm-os/ergon/releases/download/v${VERSION}/ergon_${VERSION}_${os}_${arch}.tar.gz"
        curl --fail --silent --show-error --location --retry 3 "$url" \
          | tar -xz -C "$bin" ergon
        "$bin/ergon" --version

    # Windows releases are zip archives. PowerShell extracts them with
    # native Windows paths.
    - name: Install ergon ${{ inputs.version }}
      if: runner.os == 'Windows'
      shell: pwsh
      env:
        VERSION: ${{ inputs.version }}
      run: |
        $ErrorActionPreference = 'Stop'
        $arch = @{ X64 = 'amd64'; ARM64 = 'arm64' }[$env:RUNNER_ARCH]
        if (-not $arch) { throw "ergon ships no build for $env:RUNNER_ARCH" }
        $asset = "ergon_$($env:VERSION)_windows_$arch.zip"
        $zip = Join-Path $env:RUNNER_TEMP $asset
        $url = "https://github.com/thesm-os/ergon/releases/download/v$($env:VERSION)/$asset"
        Invoke-WebRequest -Uri $url -OutFile $zip -MaximumRetryCount 3
        $dir = Join-Path $env:RUNNER_TEMP 'ergon'
        Expand-Archive -Path $zip -DestinationPath $dir -Force
        $bin = Join-Path (go env GOPATH) 'bin'
        New-Item -ItemType Directory -Force -Path $bin | Out-Null
        Copy-Item (Join-Path $dir 'ergon.exe') $bin
        & (Join-Path $bin 'ergon.exe') --version

    - name: Install GNU make
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        choco install make --version 4.4.1 --no-progress --yes
        make --version
