name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag commit is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}) is not on main."
            exit 1
          fi
          echo "Tag is on main."

  reverify:
    name: Re-run CI gate
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make check

  release:
    name: GitHub release
    needs: reverify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog section for ${{ github.ref_name }}
        id: changelog
        run: |
          tag="${GITHUB_REF_NAME}"
          # Headings follow Keep a Changelog and carry no "v" prefix,
          # while the tag does. Strip it, or every release falls back
          # to the placeholder below.
          version="${tag#v}"
          # Extract the section between [version] and the next heading.
          body=$(awk -v tag="$version" '
            $0 ~ "^## \\[" tag "\\]" { found=1; next }
            found && /^## \[/         { exit }
            found                     { print }
          ' CHANGELOG.md)
          if [ -z "$body" ]; then
            body="See [CHANGELOG.md](CHANGELOG.md)."
          fi
          {
            echo "body<<EOF"
            echo "$body"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes "${{ steps.changelog.outputs.body }}" \
            --verify-tag
