name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  validate-tag:
    name: Validate tag is on main
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify tag commit is reachable from main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} (commit ${GITHUB_SHA}) is not on main."
            exit 1
          fi
          echo "Tag is on main."

  reverify:
    name: Re-run CI gate
    needs: validate-tag
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make check

  release:
    name: GitHub release
    needs: reverify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Extract changelog section for ${{ github.ref_name }}
        run: |
          # Headings follow Keep a Changelog and carry no "v" prefix,
          # while the tag does. Strip it, or every release falls back
          # to the placeholder below.
          version="${GITHUB_REF_NAME#v}"
          # Extract the section between [version] and the next heading.
          awk -v tag="$version" '
            $0 ~ "^## \\[" tag "\\]" { found=1; next }
            found && /^## \[/         { exit }
            found                     { print }
          ' CHANGELOG.md > "${RUNNER_TEMP}/release-notes.md"
          if [ ! -s "${RUNNER_TEMP}/release-notes.md" ]; then
            echo "See [CHANGELOG.md](CHANGELOG.md)." > "${RUNNER_TEMP}/release-notes.md"
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # The notes travel as a file, never as text inside this
        # script. A ${{ }} interpolation is substituted before bash
        # parses the line, so a changelog body — full of backticks
        # and quotes — would be EXECUTED as shell, not passed as an
        # argument. That is an injection surface as well as a bug,
        # and it is why the first release with real notes failed
        # where every placeholder release before it succeeded.
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file "${RUNNER_TEMP}/release-notes.md" \
            --verify-tag
