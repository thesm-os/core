name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI runners are slower than dev laptops; per-package go test deadline
  # is aligned with the GitHub job-level timeout at 30 minutes.
  TEST_TIMEOUT: 30m

jobs:
  # Build, vet and the race tests run on every supported OS. The
  # remaining jobs check properties of the source that do not depend
  # on the runner's OS, so they run on Linux only.
  vet-build:
    name: Vet + Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make lint-vet
      - run: make build

  tidy:
    name: Modules tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make check-tidy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/bin
            ~/.npm
          key: go-tools-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make lint

  test:
    name: Test (race, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make test-race

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make check-coverage

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    # Mutation runs the suite once per mutant across the 21 layers
    # that .ergon.yaml gates. It is the one stage kept out of the
    # local hooks, so this job is where it gates.
    #
    # gremlins sets the deadline of each mutant to
    # timeout_coefficient, 120 in .ergon.yaml, times the package's
    # own test time on this runner, so a slower runner gets a
    # proportionally longer deadline. On this runner btree and crypto
    # take about 8 minutes each, and the whole sweep about 30. A run
    # cancelled at this limit has a mutant that hangs or a layer that
    # grew. The log gives the time and the count of timed-out mutants
    # of each layer.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The cache restores ~/go/bin, where setup-ergon installs ergon,
      # so it runs first and the pinned ergon overwrites a cached one.
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make check-mutation
