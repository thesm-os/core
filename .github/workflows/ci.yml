name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI runners are slower than dev laptops; per-package go test deadline
  # is aligned with the GitHub job-level timeout at 30 minutes.
  TEST_TIMEOUT: 30m

jobs:
  vet-build:
    name: Vet + Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make vet
      - run: make build

  tidy:
    name: Modules tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make check-tidy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v5
        with:
          path: |
            ~/go/bin
            ~/.npm
          key: go-tools-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make lint

  test:
    name: Test (race + 10x)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make test-race

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make check-coverage
