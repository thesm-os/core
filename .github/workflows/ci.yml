name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # CI runners are slower than dev laptops; per-package go test deadline
  # is aligned with the GitHub job-level timeout at 30 minutes.
  TEST_TIMEOUT: 30m

jobs:
  # Build, vet and the race tests run on every supported OS. The
  # remaining jobs check properties of the source that do not depend
  # on the runner's OS, so they run on Linux only.
  vet-build:
    name: Vet + Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make lint-vet
      - run: make build

  tidy:
    name: Modules tidy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make check-tidy

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: |
            ~/go/bin
            ~/.npm
          key: go-tools-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make lint

  test:
    name: Test (race, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: ./.github/actions/setup-ergon
      - run: make test-race

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/cache@v6
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make check-coverage

  mutation:
    name: Mutation
    runs-on: ubuntu-latest
    # Mutation re-runs the suite once per mutant across fifteen
    # layers. It is the one stage deliberately kept out of the local
    # hooks, so this job is where it actually gates.
    #
    # The budget assumes timeout_coefficient 400 in .ergon.yaml: the
    # per-mutant deadline scales off the package's own baseline as
    # measured on THIS runner, so a slower machine gets a
    # proportionally larger budget and the sweep degrades linearly,
    # not cliff-wise. A run hitting this ceiling means a new
    # unbounded wait got in, not a slow runner — find it with
    # `ergon check mutation --mutants` before raising anything.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The cache restores ~/go/bin, where setup-ergon installs ergon,
      # so it runs first and the pinned ergon overwrites a cached one.
      - uses: actions/cache@v5
        with:
          path: ~/go/bin
          key: go-tools-${{ hashFiles('Makefile') }}
      - uses: ./.github/actions/setup-ergon
      - run: make bootstrap
      - run: make check-mutation
